site_name: HTB Writeups — SPROMbash
site_description: Writeups de máquinas de Hack The Box (Starting Point y retiradas).
site_author: Tecén Díaz Quintana
site_url: https://sprombash.github.io/htb-writeups/

repo_name: SPROMbash/htb-writeups
repo_url: https://github.com/SPROMbash/htb-writeups

# Los writeups viven en la raíz del repo (machines/). MkDocs construye la web
# directamente desde ahí, así que GitHub y la web comparten los mismos archivos.
docs_dir: machines

theme:
  name: material
  language: es
  # Plantillas propias (portada, cabecera de los writeups, paleta Ctrl+K) y los
  # archivos estáticos del rediseño. Material usa lo que haya aquí antes que lo suyo.
  custom_dir: overrides
  font:
    text: Montserrat          # la misma tipografía de texto que la web de Cenco
    code: JetBrains Mono
  palette:
    # 'custom': los colores reales se definen en overrides/assets/stylesheets/htb.css
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant      # carga instantánea (SPA)
    - navigation.tracking
    - navigation.indexes      # permite que README.md sea el índice de cada máquina
    - navigation.prune        # el menú lateral solo incluye el grupo abierto (escala a cientos de máquinas)
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy       # botón de copiar en cada bloque de código
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

# Nota: NO definimos 'nav:' a propósito. Así MkDocs genera el menú
# automáticamente desde la estructura de carpetas: añadir machines/<maquina>/
# hace que aparezca sola en la web. Ese es el comportamiento "recursivo".

# Hook que lee el front-matter de cada machines/<maquina>/README.md y genera la
# rejilla, las estadísticas y el índice de la paleta Ctrl+K. Se ejecuta dentro de
# `mkdocs build`, así que el workflow de GitHub Actions no cambia.
hooks:
  - hooks/machines.py

extra_css:
  - assets/stylesheets/htb.css
extra_javascript:
  - assets/javascripts/htb.js

plugins:
  - search:
      lang: es
  - tags                        # agrupa los writeups por etiqueta; el índice va en tags.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:      # además permite diagramas Mermaid en la web
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:          # habilita los iconos :fontawesome-...: y :material-...:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SPROMbash
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/TU-PERFIL   # <-- cambia por tu URL real de LinkedIn
